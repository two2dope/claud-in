<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #c2502f; }
    #hook-words { position: absolute; left: 96px; top: 300px; width: 888px; font-family: 'Archivo Black'; font-size: 134px; line-height: 0.98; letter-spacing: -0.02em; color: #2b1a10; }
    .hook-w { display: block; width: max-content; }
    #hook-claudin { position: absolute; left: 320px; top: 970px; width: 440px; height: 330px; }
    #hook-claudin img { width: 440px; height: 330px; }
  </style>
  <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
    <div id="hook-words">
      <span id="hook-w1" class="hook-w">SEU</span>
      <span id="hook-w2" class="hook-w">CLAUDE</span>
      <span id="hook-w3" class="hook-w">GANHOU</span>
      <span id="hook-w4" class="hook-w">UMA CREW</span>
    </div>
    <div id="hook-claudin"><img src="assets/claudin-ok.svg" alt="Claudin" /></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const B = 0.5735;
    // Cada linha acende (creme) no seu tempo, com um soco de escala; na última batida tudo acende junto.
    const lit = [[1, 0], [2, 1], [3, 2], [4, 4]];
    lit.forEach(([n, b]) => {
      tl.set(`#hook-w${n}`, { color: '#fff1d6' }, b * B);
      tl.fromTo(`#hook-w${n}`, { scale: 1.06, transformOrigin: '0% 60%' }, { scale: 1, duration: 0.14, ease: 'power3.out' }, b * B);
    });
    tl.fromTo('#hook-w4', { scale: 1.08, transformOrigin: '0% 60%' }, { scale: 1, duration: 0.18, ease: 'power3.out' }, 6 * B);
    // O Claudin pula em todas as batidas.
    for (let b = 0; b < 8; b++) {
      tl.fromTo('#hook-claudin', { y: 0, scaleX: 1.12, scaleY: 0.88, transformOrigin: '50% 100%' }, { y: -70, scaleX: 0.95, scaleY: 1.06, duration: 0.2, ease: 'power3.out' }, b * B);
      tl.to('#hook-claudin', { y: 0, scaleX: 1, scaleY: 1, duration: 0.25, ease: 'power2.in' }, b * B + 0.2);
    }
    window.__timelines['hook'] = tl;
  </script>
</template>
