<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: #D97757; }
    .sk-p { position: absolute; inset: 0; }
    .sk-name { position: absolute; left: 96px; top: 300px; width: 888px; font-family: 'Archivo Black'; font-size: 200px; line-height: 1; letter-spacing: -0.02em; color: #fff1d6; }
    .sk-name span { display: inline-block; }
    .sk-spr { position: absolute; left: 220px; top: 600px; width: 640px; height: 480px; }
    .sk-spr img { width: 640px; height: 480px; }
    .sk-line { position: absolute; left: 96px; top: 1140px; width: 888px; font-family: 'Space Mono'; font-weight: 700; font-size: 52px; color: #2b1a10; }
  </style>
  <div id="root" data-composition-id="skins" data-width="1080" data-height="1920">
    <div id="sk-1" class="sk-p" style="background: #D97757">
      <div class="sk-name"><span id="sk-n1" style="font-size: 165px">MANGUE</span></div>
      <div id="sk-s1" class="sk-spr"><img src="assets/skin-mangue.svg" alt="Claudin na skin Mangue" /></div>
      <div class="sk-line">o original, coral</div>
    </div>
    <div id="sk-2" class="sk-p" style="background: #2f9e9a; opacity: 0">
      <div class="sk-name"><span id="sk-n2">MARÉ</span></div>
      <div id="sk-s2" class="sk-spr"><img src="assets/skin-mare.svg" alt="Claudin na skin Maré" /></div>
      <div class="sk-line">azul da maré</div>
    </div>
    <div id="sk-3" class="sk-p" style="background: #c9a35a; opacity: 0">
      <div class="sk-name"><span id="sk-n3" style="font-size: 142px; color: #2b1a10">MALUNGO</span></div>
      <div id="sk-s3" class="sk-spr"><img src="assets/skin-malungo.svg" alt="Claudin na skin Malungo, de chapéu de palha" /></div>
      <div class="sk-line">salve, Chico Science</div>
    </div>
    <div id="sk-4" class="sk-p" style="background: #7d6b43; opacity: 0">
      <div class="sk-name"><span id="sk-n4">LAMA</span></div>
      <div id="sk-s4" class="sk-spr"><img src="assets/skin-lama.svg" alt="Claudin na skin Lama, com brotinho" /></div>
      <div class="sk-line" style="color: #fff1d6">brotinho na cabeça</div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    const B = 0.5735, BAR = 2.294;
    for (let i = 1; i <= 4; i++) {
      const t = (i - 1) * BAR;
      // Corte seco no compasso: o painel anterior some e este aparece.
      if (i > 1) {
        tl.set(`#sk-${i - 1}`, { opacity: 0 }, t);
        tl.set(`#sk-${i}`, { opacity: 1 }, t);
      }
      tl.fromTo(`#sk-n${i}`, { scale: 1.15, transformOrigin: '0% 70%' }, { scale: 1, duration: 0.16, ease: 'power3.out' }, t);
      tl.fromTo(`#sk-s${i}`, { scale: 0.7, transformOrigin: '50% 100%' }, { scale: 1, duration: 0.3, ease: 'back.out(2)' }, t);
      // Pulinho nas batidas 2 e 4 do compasso.
      [1, 3].forEach(b => {
        tl.fromTo(`#sk-s${i}`, { y: 0 }, { y: -60, duration: 0.18, ease: 'power3.out' }, t + b * B);
        tl.to(`#sk-s${i}`, { y: 0, duration: 0.22, ease: 'power2.in' }, t + b * B + 0.18);
      });
    }
    window.__timelines['skins'] = tl;
  </script>
