  <script>
    const tl = gsap.timeline({ paused: true });
    tl.fromTo('.s2-line > span', { yPercent: 110 }, { yPercent: 0, duration: 0.3, ease: 'power4.out', stagger: 0.08 }, 0.05);
    // O prompt aparece já digitado e entra de baixo.
    tl.fromTo('#s2-prompt', { y: 60, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: 'power3.out' }, 0.1);
    // Poses e balões: cada passo do Claude troca a pose (com squash) e o texto do balão.
    const steps = [0.5, 1.6, 2.75, 3.8];
    tl.set(['#s2-p2', '#s2-p3', '#s2-p4', '#s2-say2', '#s2-say3', '#s2-say4'], { opacity: 0 }, 0);
    tl.set(['#s2-p1', '#s2-say1'], { opacity: 1 }, 0);
    tl.fromTo('#s2-bal', { scale: 0, transformOrigin: '50% 100%' }, { scale: 1, duration: 0.35, ease: 'back.out(1.7)' }, steps[0]);
    for (let i = 1; i < 4; i++) {
      const t = steps[i];
      tl.to('#s2-claudin', { scaleX: 1.1, scaleY: 0.9, duration: 0.1, ease: 'power2.in', transformOrigin: '50% 100%' }, t - 0.1);
      tl.set(`#s2-p${i}`, { opacity: 0 }, t);
      tl.set(`#s2-p${i + 1}`, { opacity: 1 }, t);
      tl.set(`#s2-say${i}`, { opacity: 0 }, t);

      tl.to('#s2-claudin', { scaleX: 1, scaleY: 1, duration: 0.3, ease: 'back.out(2.2)' }, t);
      tl.fromTo('#s2-bal', { scale: 0.92 }, { scale: 1, duration: 0.25, ease: 'back.out(2)' }, t);

    // Comemoração no fim.
    tl.to('#s2-claudin', { y: -90, duration: 0.22, ease: 'power3.out' }, 4.15);
