<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
<title id="t">Os balões do Claudin</title>
<desc id="d">Quatro cenas em ciclo: tarefa longa, falha com botão investigar, comando de risco e resumo do fim do turno.</desc>
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><rect x="11" y="11" width="2" height="2" fill="#262626"/></pattern></defs>
<rect width="1280" height="340" fill="#161616"/>
<rect width="1280" height="340" fill="url(#dots)"/>
<g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.0000;0.2500" dur="16s" repeatCount="indefinite"/><rect x="64" y="56" width="560" height="64" fill="#1f1f1f" stroke="#f5f4ed" stroke-width="4"/><rect x="148" y="118" width="24" height="4" fill="#1f1f1f" /><rect x="148" y="122" width="24" height="12" fill="#1f1f1f" /><rect x="148" y="122" width="4" height="12" fill="#f5f4ed" /><rect x="168" y="122" width="4" height="12" fill="#f5f4ed" /><rect x="148" y="134" width="24" height="4" fill="#f5f4ed" /><text x="88" y="96" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="22" fill="#f5f4ed" >Ainda rodando: npm test (30 s+).</text><g transform="translate(64 150) scale(12)" shape-rendering="crispEdges"><rect x="4" y="1" width="1" height="1" fill="#D97757"/><rect x="4" y="2" width="1" height="1" fill="#D97757"/><rect x="11" y="1" width="1" height="1" fill="#D97757"/><rect x="11" y="2" width="1" height="1" fill="#D97757"/><rect x="3" y="3" width="10" height="5" fill="#D97757"/><rect x="2" y="4" width="12" height="3" fill="#D97757"/><rect x="0" y="5" width="2" height="1" fill="#D97757"/><rect x="14" y="5" width="2" height="1" fill="#D97757"/><g><rect x="3" y="8" width="1" height="2" fill="#D97757"/><rect x="5" y="8" width="1" height="2" fill="#D97757"/><rect x="10" y="8" width="1" height="2" fill="#D97757"/><rect x="12" y="8" width="1" height="2" fill="#D97757"/><animateTransform attributeName="transform" type="translate" values="0 0;0 .6;0 0" dur=".35s" repeatCount="indefinite"/></g><rect x="5" y="4" width="2" height="2" fill="#f5f4ed"></rect><rect x="5.5" y="5" width="1" height="1" fill="#1a1a1a"></rect><rect x="10" y="4" width="2" height="2" fill="#f5f4ed"></rect><rect x="10.5" y="5" width="1" height="1" fill="#1a1a1a"></rect></g><text x="700" y="150" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="30" fill="#f5f4ed" >Tarefa longa</text><text x="700" y="188" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="18" fill="#cfcdc3" >Passou de 30 segundos: ele avisa.</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.2500;0.5000" dur="16s" repeatCount="indefinite"/><rect x="64" y="56" width="560" height="64" fill="#1f1f1f" stroke="#d64545" stroke-width="4"/><rect x="148" y="118" width="24" height="4" fill="#1f1f1f" /><rect x="148" y="122" width="24" height="12" fill="#1f1f1f" /><rect x="148" y="122" width="4" height="12" fill="#d64545" /><rect x="168" y="122" width="4" height="12" fill="#d64545" /><rect x="148" y="134" width="24" height="4" fill="#d64545" /><text x="88" y="96" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="22" fill="#f5f4ed" >Falhou: npm test. Quer que eu investigue?</text><rect x="290" y="200" width="120" height="34" fill="#2a2a2a" stroke="#D97757" stroke-width="2"/><text x="300" y="223" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="17" fill="#D97757" >investigar</text><g transform="translate(64 150) scale(12)" shape-rendering="crispEdges"><rect x="4" y="1" width="1" height="1" fill="#D97757"/><rect x="4" y="2" width="1" height="1" fill="#D97757"/><rect x="11" y="1" width="1" height="1" fill="#D97757"/><rect x="11" y="2" width="1" height="1" fill="#D97757"/><rect x="3" y="3" width="10" height="5" fill="#D97757"/><rect x="2" y="4" width="12" height="3" fill="#D97757"/><rect x="0" y="5" width="2" height="1" fill="#D97757"/><rect x="14" y="5" width="2" height="1" fill="#D97757"/><g><rect x="3" y="8" width="1" height="2" fill="#D97757"/><rect x="5" y="8" width="1" height="2" fill="#D97757"/><rect x="10" y="8" width="1" height="2" fill="#D97757"/><rect x="12" y="8" width="1" height="2" fill="#D97757"/></g><rect x="5" y="4" width="1" height="1" fill="#1a1a1a"/><rect x="7" y="4" width="1" height="1" fill="#1a1a1a"/><rect x="6" y="5" width="1" height="1" fill="#1a1a1a"/><rect x="5" y="6" width="1" height="1" fill="#1a1a1a"/><rect x="7" y="6" width="1" height="1" fill="#1a1a1a"/><rect x="9" y="4" width="1" height="1" fill="#1a1a1a"/><rect x="11" y="4" width="1" height="1" fill="#1a1a1a"/><rect x="10" y="5" width="1" height="1" fill="#1a1a1a"/><rect x="9" y="6" width="1" height="1" fill="#1a1a1a"/><rect x="11" y="6" width="1" height="1" fill="#1a1a1a"/></g><text x="700" y="150" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="30" fill="#f5f4ed" >Falha</text><text x="700" y="188" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="18" fill="#cfcdc3" >O botão só preenche o prompt. Você decide enviar.</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.5000;0.7500" dur="16s" repeatCount="indefinite"/><rect x="64" y="56" width="560" height="64" fill="#1f1f1f" stroke="#f5b73d" stroke-width="4"/><rect x="148" y="118" width="24" height="4" fill="#1f1f1f" /><rect x="148" y="122" width="24" height="12" fill="#1f1f1f" /><rect x="148" y="122" width="4" height="12" fill="#f5b73d" /><rect x="168" y="122" width="4" height="12" fill="#f5b73d" /><rect x="148" y="134" width="24" height="4" fill="#f5b73d" /><text x="88" y="96" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="22" fill="#f5f4ed" >Cuidado: git push --force pode apagar coisas.</text><g transform="translate(64 150) scale(12)" shape-rendering="crispEdges"><rect x="4" y="1" width="1" height="1" fill="#D97757"/><rect x="4" y="2" width="1" height="1" fill="#D97757"/><rect x="11" y="1" width="1" height="1" fill="#D97757"/><rect x="11" y="2" width="1" height="1" fill="#D97757"/><rect x="3" y="3" width="10" height="5" fill="#D97757"/><rect x="2" y="4" width="12" height="3" fill="#D97757"/><rect x="0" y="5" width="2" height="1" fill="#D97757"/><rect x="14" y="5" width="2" height="1" fill="#D97757"/><g><rect x="3" y="8" width="1" height="2" fill="#D97757"/><rect x="5" y="8" width="1" height="2" fill="#D97757"/><rect x="10" y="8" width="1" height="2" fill="#D97757"/><rect x="12" y="8" width="1" height="2" fill="#D97757"/></g><rect x="5" y="4" width="2" height="2" fill="#f5f4ed"><animate attributeName="height" values="2;2;2;.3;2" dur="4s" repeatCount="indefinite"/></rect><rect x="5.5" y="4.5" width="1" height="1" fill="#1a1a1a"><animate attributeName="height" values="1;1;1;.2;1" dur="4s" repeatCount="indefinite"/></rect><rect x="10" y="4" width="2" height="2" fill="#f5f4ed"><animate attributeName="height" values="2;2;2;.3;2" dur="4s" repeatCount="indefinite"/></rect><rect x="10.5" y="4.5" width="1" height="1" fill="#1a1a1a"><animate attributeName="height" values="1;1;1;.2;1" dur="4s" repeatCount="indefinite"/></rect><rect x="7.5" y="0" width="1" height="1.6" fill="#f5b73d"/><rect x="7.5" y="2" width="1" height="0.6" fill="#f5b73d"/></g><text x="700" y="150" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="30" fill="#f5f4ed" >Comando de risco</text><text x="700" y="188" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="18" fill="#cfcdc3" >Aviso antes de você aprovar.</text></g><g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.7500;1.0000" dur="16s" repeatCount="indefinite"/><rect x="64" y="56" width="560" height="64" fill="#1f1f1f" stroke="#5cb85c" stroke-width="4"/><rect x="148" y="118" width="24" height="4" fill="#1f1f1f" /><rect x="148" y="122" width="24" height="12" fill="#1f1f1f" /><rect x="148" y="122" width="4" height="12" fill="#5cb85c" /><rect x="168" y="122" width="4" height="12" fill="#5cb85c" /><rect x="148" y="134" width="24" height="4" fill="#5cb85c" /><text x="88" y="96" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="22" fill="#f5f4ed" >Pronto: 2 arquivos editados, 1 comando.</text><rect x="290" y="200" width="140" height="34" fill="#2a2a2a" stroke="#D97757" stroke-width="2"/><text x="300" y="223" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="17" fill="#D97757" >rodar testes</text><g transform="translate(64 150) scale(12)" shape-rendering="crispEdges"><rect x="4" y="1" width="1" height="1" fill="#D97757"/><rect x="4" y="2" width="1" height="1" fill="#D97757"/><rect x="11" y="1" width="1" height="1" fill="#D97757"/><rect x="11" y="2" width="1" height="1" fill="#D97757"/><rect x="3" y="3" width="10" height="5" fill="#D97757"/><rect x="2" y="4" width="12" height="3" fill="#D97757"/><rect x="0" y="2" width="2" height="1" fill="#D97757"/><rect x="0" y="3" width="1" height="1" fill="#D97757"/><rect x="14" y="2" width="2" height="1" fill="#D97757"/><rect x="15" y="3" width="1" height="1" fill="#D97757"/><g><rect x="3" y="8" width="1" height="2" fill="#D97757"/><rect x="5" y="8" width="1" height="2" fill="#D97757"/><rect x="10" y="8" width="1" height="2" fill="#D97757"/><rect x="12" y="8" width="1" height="2" fill="#D97757"/></g><rect x="5" y="4" width="2" height="2" fill="#f5f4ed"><animate attributeName="height" values="2;2;2;.3;2" dur="4s" repeatCount="indefinite"/></rect><rect x="5.5" y="4.5" width="1" height="1" fill="#1a1a1a"><animate attributeName="height" values="1;1;1;.2;1" dur="4s" repeatCount="indefinite"/></rect><rect x="10" y="4" width="2" height="2" fill="#f5f4ed"><animate attributeName="height" values="2;2;2;.3;2" dur="4s" repeatCount="indefinite"/></rect><rect x="10.5" y="4.5" width="1" height="1" fill="#1a1a1a"><animate attributeName="height" values="1;1;1;.2;1" dur="4s" repeatCount="indefinite"/></rect></g><text x="700" y="150" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="30" fill="#f5f4ed" >Fim do turno</text><text x="700" y="188" font-family="ui-monospace, SFMono-Regular, Consolas, Menlo, monospace" font-size="18" fill="#cfcdc3" >Resumo e a próxima ação sugerida.</text></g>
</svg>
